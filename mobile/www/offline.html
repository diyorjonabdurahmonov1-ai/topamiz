<!doctype html>
<!-- Shown by the app when findo.net.uz can't be reached (server.errorPath). -->
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Findo</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f8fc; --fg: #0f1222; --muted: #5b6178; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0e1a; --fg: #eef0f8; --muted: #9aa0b8; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  .logo {
    width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #6366f1, #a855f7 55%, #22d3ee);
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 4px; }
  button {
    margin-top: 22px; border: 0; border-radius: 14px; padding: 13px 28px;
    font: 600 15px -apple-system, sans-serif; color: #fff;
    background: linear-gradient(90deg, #6366f1, #7c3aed);
  }
</style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true"></div>
    <h1 id="title">Internet yo'q</h1>
    <p id="text">Findo'ni ochish uchun internetga ulaning.</p>
    <button id="retry" type="button" onclick="location.href='https://findo.net.uz'">Qayta urinish</button>
  </main>
  <script>
    // The app's own page, so the site's language setting isn't reachable:
    // the phone's language decides, Uzbek when it is none of ours.
    var TEXT = {
      uz: ["Internet yo'q", "Findo'ni ochish uchun internetga ulaning.", "Qayta urinish"],
      ru: ["Нет интернета", "Подключитесь к интернету, чтобы открыть Findo.", "Повторить"],
      en: ["No internet", "Connect to the internet to open Findo.", "Try again"],
      kk: ["Интернет жоқ", "Findo-ны ашу үшін интернетке қосылыңыз.", "Қайталау"],
      ky: ["Интернет жок", "Findo'ну ачуу үчүн интернетке туташыңыз.", "Кайра аракет кылуу"],
      tg: ["Интернет нест", "Барои кушодани Findo ба интернет пайваст шавед.", "Дубора кӯшиш кардан"]
    };
    var code = String(navigator.language || "uz").slice(0, 2).toLowerCase();
    var words = TEXT[code] || TEXT.uz;
    document.documentElement.lang = TEXT[code] ? code : "uz";
    document.getElementById("title").textContent = words[0];
    document.getElementById("text").textContent = words[1];
    document.getElementById("retry").textContent = words[2];
  </script>
</body>
</html>
