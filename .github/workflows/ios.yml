# Builds the iPhone app (mobile/: https://findo.net.uz in a Capacitor shell,
# with Apple push notifications) on a GitHub macOS runner — no Mac needed —
# and, on main or when run by hand, signs it and uploads it to App Store
# Connect, where it shows up in TestFlight a few minutes later.
#
# Signing is automatic (Xcode's cloud-managed certificates) with an App Store
# Connect API key, kept only in this repository's Actions secrets — never in
# the repository itself, which is public:
#   APPLE_TEAM_ID    developer.apple.com → Membership details → Team ID
#   ASC_KEY_ID       App Store Connect → Users and Access → Integrations →
#   ASC_ISSUER_ID      App Store Connect API → a key with "Admin" access:
#   ASC_KEY_P8         its Key ID, the Issuer ID, and the .p8 file's contents
# Without them the app is still compiled (unsigned) to prove it builds.
# Details in mobile/README.md.
name: iOS app

on:
  push:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor and sync the native project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: Compile (unsigned)
        if: env.HAS_KEYS != 'true' || env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO build | tail -80

      - name: Archive, sign and upload to App Store Connect
        if: env.HAS_KEYS == 'true' && env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Every upload needs a higher build number: the workflow's run number.
          build=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Findo.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$build" \
            "${auth[@]}" archive | tail -80
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" mobile/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Findo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" | tail -80
          rm -f "$key"
          echo "Uploaded build $build — it appears in App Store Connect → TestFlight after Apple processes it." >> "$GITHUB_STEP_SUMMARY"
