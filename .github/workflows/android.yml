# Builds the Android app (mobile/android: https://findo.net.uz in a Capacitor
# shell, with Firebase push) as an UNSIGNED release App Bundle and checks it
# with Google's bundletool. On main, or when run by hand, it also publishes
# the bundle to the `android-build` branch as findo-unsigned.aab.
#
# Signing is deliberately not done here: this repository is public, and the
# Play upload key must never be in it or in its CI. The owner signs the bundle
# offline with the upload keystore before uploading it to Google Play — see
# mobile/README.md.
#
# Push needs the Firebase config: the GOOGLE_SERVICES_JSON Actions secret
# (the google-services.json file's contents). Without it the app still builds
# and works, just without notifications.
name: Android app bundle

on:
  push:
    branches-ignore: [android-build]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor and sync the native project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Firebase config (push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            echo "Push: on"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret isn't set: this build has no push notifications."
          fi

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build release bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Validate with bundletool
        run: |
          url=$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)
          curl -fsSL -o bundletool.jar "$url"
          aab=mobile/android/app/build/outputs/bundle/release/app-release.aab
          java -jar bundletool.jar validate --bundle="$aab"
          java -jar bundletool.jar dump manifest --bundle="$aab" | head -40
          ls -l "$aab"

      - uses: actions/upload-artifact@v4
        with:
          name: findo-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to the android-build branch
        if: env.PUBLISH == 'true'
        run: |
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab /tmp/findo-unsigned.aab
          gradle=mobile/android/app/build.gradle
          version="$(sed -n 's/^ *versionName "\(.*\)"/\1/p' $gradle) ($(sed -n 's/^ *versionCode \([0-9]*\)/\1/p' $gradle))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mobile/android/app/google-services.json
          git reset -q --hard
          git switch --orphan android-build-tmp
          cp /tmp/findo-unsigned.aab findo-unsigned.aab
          printf 'version: %s\nsource commit: %s\n' "$version" "$GITHUB_SHA" > BUILD_INFO.txt
          git add findo-unsigned.aab BUILD_INFO.txt
          git commit -q -m "Unsigned app bundle $version from $GITHUB_SHA"
          git push -f origin HEAD:android-build
