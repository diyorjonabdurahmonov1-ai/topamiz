# Builds the Android app (a Trusted Web Activity wrapping https://findo.net.uz,
# generated with Bubblewrap — see android/twa-manifest.json) as an UNSIGNED
# release App Bundle, checks it with Google's bundletool, and publishes it to
# the `android-build` branch as findo-unsigned.aab.
#
# Signing is deliberately not done here: this repository is public, and the
# Play upload key must never be in it or in its CI. The owner signs the bundle
# offline with the upload keystore before uploading it to Google Play — see
# android/README.md.
name: Android app bundle

on:
  push:
    branches-ignore: [android-build]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Validate with bundletool
        run: |
          url=$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)
          curl -fsSL -o bundletool.jar "$url"
          aab=android/app/build/outputs/bundle/release/app-release.aab
          java -jar bundletool.jar validate --bundle="$aab"
          java -jar bundletool.jar dump manifest --bundle="$aab"
          ls -l "$aab"

      - uses: actions/upload-artifact@v4
        with:
          name: findo-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to the android-build branch
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/findo-unsigned.aab
          version=$(jq -r '.appVersionName + " (" + (.appVersionCode|tostring) + ")"' android/twa-manifest.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan android-build-tmp
          cp /tmp/findo-unsigned.aab findo-unsigned.aab
          printf 'version: %s\nsource commit: %s\n' "$version" "$GITHUB_SHA" > BUILD_INFO.txt
          git add findo-unsigned.aab BUILD_INFO.txt
          git commit -q -m "Unsigned app bundle $version from $GITHUB_SHA"
          git push -f origin HEAD:android-build
